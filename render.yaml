services:
  - type: web
    name: dayleey-web
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py setup_schedules
    startCommand: gunicorn dayleey.wsgi --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: dayleey.settings.prod
      - key: WA_DRY_RUN
        value: "False"
  - type: worker
    name: dayleey-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py qcluster
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: dayleey.settings.prod
      - key: WA_DRY_RUN
        value: "False"
